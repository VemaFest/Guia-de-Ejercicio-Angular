<app-logout-component></app-logout-component>
<main>
    <h1>Registrar Mascota</h1>
    <form (ngSubmit)="formulario()">
        <div>
            <label>Nombre</label>
            <input type="text" required="required" name="nombre" [(ngModel)]="mascota.nombre">
        </div>
        <div>
            <label>Especie</label>
            <input type="text" required="required" name="especie" [(ngModel)]="mascota.especie">
        </div>
        <div>
            <label>Edad</label>
            <input type="number" required="required" name="edad" [(ngModel)]="mascota.edad">
        </div>
        <div>
            <label>Propietario</label>
            <input type="text" required="required" name="propietario" [(ngModel)]="mascota.propietario">
        </div>
        <div>
            <button type="submit">Registrar Mascota</button>
        </div>
    </form>



    <h2>Mascotas registradas</h2>
    <table>
        <thead>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Edad</th>
            <th>Propietario</th>
        </thead>
        <tbody>
            @for (mascota of mascotas; track $index) {
                <td> {{ mascota.nombre }} </td>
                <td> {{ mascota.especie }} </td>
                <td> {{ mascota.edad }} </td>
                <td> {{ mascota.propietario}} </td>
            }
        </tbody>
    </table>
    @if (mascotas.length === 0) {
        No hay mascotas registradas
    }
</main>
